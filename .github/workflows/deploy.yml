name: deploy

on:
  workflow_run:
    workflows: [container]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Ask Render to deploy this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --silent --show-error --max-time 60 --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}" > /dev/null
          echo "Deploy requested for ${COMMIT_SHA}"

      - name: Wait until the new commit is live
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SITE_URL: https://zerotrustportfolio.onrender.com
        run: |
          for attempt in $(seq 1 60); do
            live="$(curl --silent --max-time 30 "${SITE_URL}/version" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "attempt ${attempt}: live commit is ${live:-unavailable}"
            if [ "${live}" = "${COMMIT_SHA}" ]; then
              echo "The deployed commit is live."
              exit 0
            fi
            sleep 15
          done
          echo "Render did not report ${COMMIT_SHA} within 15 minutes."
          exit 1

          