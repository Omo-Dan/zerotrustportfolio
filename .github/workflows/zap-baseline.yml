name: zap-baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag zerotrustportfolio:ci .

      - name: Start the app on a private network
        run: |
          docker network create zapnet
          docker run --detach --name app --network zapnet --env APP_ENV=production --publish 127.0.0.1:8000:8000 zerotrustportfolio:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Pull ZAP and print its digest
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker image inspect ghcr.io/zaproxy/zaproxy:stable --format '{{index .RepoDigests 0}}'

      - name: ZAP baseline scan (passive, advisory)
        run: |
          mkdir zap-out
          chmod 777 zap-out
          docker run --rm --network zapnet --volume "${PWD}/zap-out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://app:8000 -r zap-report.html -I