name: dependency-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit runtime requirements
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
      - name: Audit dev requirements
        run: pip-audit -r requirements-dev.txt --require-hashes --disable-pip
      